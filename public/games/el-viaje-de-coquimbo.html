function updateBoss(){
if(!boss||boss.state==='dead')return;
if(boss.state==='wait'){if(player.x>(boss.trigX||178*TILE))boss.state='fight';return}
if(boss.hurtT>0)boss.hurtT--;
boss.vy=(boss.vy||0)+GRAV;if(boss.vy>14)boss.vy=14;
const chase=boss.hurtT>0?0:(player.x>boss.x?1:-1);
boss.vx=0.85*chase*(boss.maya?1.3:1);
boss.x+=boss.vx;collideH(boss);
if(boss.hitWall){boss.dir*=-1;boss.vx=0.85*chase*(boss.maya?1.3:1)}
boss.jt--;
if(boss.jt<=0&&boss.onGround){boss.vy=-(boss.maya?10.5:9.5);boss.jt=(boss.maya?46:70)+Math.floor(Math.random()*50);sStomp()}
boss.y+=boss.vy;collideV(boss,false);
if(boss.y>ROWS*TILE+100)boss.state='dead';
if(rectOverlap(player,boss)){
if(player.vy>0&&player.y+player.h-boss.y<26){
if(boss.hurtT<=0)boss.hp--;
boss.hurtT=50;
player.vy=-11;player.stompAir=false;player.jumping=false;
score+=200;sStomp();
if(boss.hp<=0)bossDie();
}else hurt(false);
}
}

function tileAt(tx,ty){if(tx<0||tx>=COLS)return '#';if(ty<0||ty>=ROWS)return '.';return map[ty][tx]}
function isSolid(tx,ty){return SOLID.indexOf(tileAt(tx,ty))>=0}

function collideH(e){
e.hitWall=false;
const T=Math.floor(e.y/TILE),B=Math.floor((e.y+e.h-1)/TILE);
if(e.vx>0){const c=Math.floor((e.x+e.w)/TILE);
for(let r=T;r<=B;r++)if(isSolid(c,r)){e.x=c*TILE-e.w-0.01;e.vx=0;e.hitWall=true;break}}
else if(e.vx<0){const c=Math.floor(e.x/TILE);
for(let r=T;r<=B;r++)if(isSolid(c,r)){e.x=(c+1)*TILE+0.01;e.vx=0;e.hitWall=true;break}}
}
function collideV(e,isP){
const L=Math.floor(e.x/TILE),R=Math.floor((e.x+e.w-1)/TILE);
if(e.vy>0){const r=Math.floor((e.y+e.h)/TILE);
for(let c=L;c<=R;c++)if(isSolid(c,r)){e.y=r*TILE-e.h;e.vy=0;e.onGround=true;return}
e.onGround=false}
else if(e.vy<0){const r=Math.floor(e.y/TILE);let hit=false,bx=-1,best=1e9;
for(let c=L;c<=R;c++)if(isSolid(c,r)){hit=true;const d=Math.abs(c*TILE+16-(e.x+e.w/2));if(d<best){best=d;bx=c}}
if(!hit&&isP){for(let c=L;c<=R;c++)if(tileAt(c,r)==='I'){
map[r][c]='U';bumps[c+','+r]=10;lives++;s1up();
popups.push({x:c*TILE+16,y:r*TILE-14,text:'¡VIDA EXTRA!',life:90,color:'#7FE87F'});
particles.push({type:'star',x:c*TILE+16,y:r*TILE+6,vx:0,vy:0,life:16});
particles.push({type:'spark',x:c*TILE+8,y:r*TILE+16,vx:-1,vy:-1,life:20});
particles.push({type:'spark',x:c*TILE+24,y:r*TILE+16,vx:1,vy:-1,life:20});
e.y=(r+1)*TILE+0.01;e.vy=0;hit=true;break}}
if(hit){e.y=(r+1)*TILE+0.01;e.vy=0;if(isP)bumpBlock(bx,r)}}
}

function updatePlayer(){
const p=player;
if(p.inv>0)p.inv--;
if(transformT>0)transformT--;
if(fireCd>0)fireCd--;
if(p.landT>0)p.landT--;
if(p.onGround){p.stompAir=false;p.jumping=false}
const left=keys.ArrowLeft||keys.KeyA,right=keys.ArrowRight||keys.KeyD;
const wantCrouch=(keys.ArrowDown||keys.KeyS)&&p.power>=1&&p.onGround;
if(wantCrouch&&!p.crouch)setCrouch(p,true);
if(!wantCrouch&&p.crouch)setCrouch(p,false);
const max=(keys.ShiftLeft||keys.ShiftRight)?MAXSPRINT:MAXRUN;
const acc=p.onGround?0.6:0.4;
if(p.crouch){p.vx*=p.onGround?0.75:1}
else{
if(right&&!left){if(p.vx<-1&&p.onGround)dust(p.x+p.w/2,p.y+p.h,2);p.vx+=acc;p.facing=1}
else if(left&&!right){if(p.vx>1&&p.onGround)dust(p.x+p.w/2,p.y+p.h,2);p.vx-=acc;p.facing=-1}
else if(p.onGround)p.vx*=0.8;
}
if(p.vx>max)p.vx=max;if(p.vx<-max)p.vx=-max;
if(Math.abs(p.vx)<0.05&&(!right||p.crouch)&&(!left||p.crouch))p.vx=0;
const wantJump=keys.Space||keys.ArrowUp||keys.KeyW;
if(wantJump&&p.onGround&&!p.jumpHeld){p.vy=JUMPV;p.onGround=false;p.jumpHeld=true;p.jumping=true;ac();sJump();dust(p.x+p.w/2,p.y+p.h,3)}
if(!wantJump)p.jumpHeld=false;
if(!wantJump&&p.jumping&&p.vy<JUMPCUT)p.vy=JUMPCUT;
if(p.stompAir&&jumpBufT>0){
p.vy=-15;jumpBufT=0;p.stompAir=false;p.jumping=false;sBoost();
particles.push({type:'spark',x:p.x+p.w/2,y:p.y+p.h,vx:0,vy:-1.5,life:22});
}
if((keys.KeyX||keys.KeyK)&&p.power===2&&fireCd<=0&&fireballs.length<2){
const my=p.y+(p.power>=1?8:3);
const mx=p.facing>0?p.x+p.w+8:p.x-20;
fireballs.push({x:mx,y:my,w:12,h:12,vx:4.5*p.facing,vy:2,life:60,onGround:false,bounces:0});
fireCd=14;sFire();
}
p.vy+=GRAV;if(p.vy>16)p.vy=16;
const wasG=p.onGround,pvy=p.vy;
p.x+=p.vx;collideH(p);
p.y+=p.vy;collideV(p,true);
if(p.onGround&&!wasG&&pvy>7){p.landT=8;dust(p.x+p.w/2,p.y+p.h,4);particles.push({type:'ring',x:p.x+p.w/2,y:p.y+p.h-3,vx:0,vy:0,life:14})}
if(p.onGround&&Math.abs(p.vx)>3&&frame%9===0)dust(p.x+p.w/2-p.facing*8,p.y+p.h,1);
if(p.onGround&&Math.abs(p.vx)<0.2&&frame%150===0)particles.push({type:'breath',x:p.x+p.w/2+p.facing*15,y:p.y+10,vx:p.facing*0.5,vy:-0.4,life:26});
if(p.x<0)p.x=0;
if(p.x>CP_X&&!checkpoint){checkpoint=true;popups.push({x:p.x+10,y:p.y-20,text:'CHECKPOINT',life:60,color:'#AFE8FF'})}
if(p.y>ROWS*TILE+60)hurt(true);
if(jumpBufT>0)jumpBufT--;
}

if(!force&&player.power>0){
player.power--;resizePower();player.inv=130;transformT=26;sShrink();
popups.push({x:player.x+10,y:player.y-16,text:'¡OUCH!',life:40,color:'#FF9090'});
return}

if(lives<=0){state='gameover';return}
state='dying';dieT=80;player.vy=-11;
}

if(checkpoint){
const pul=0.5+0.3*Math.sin(frame/12);
const gg=ctx.createRadialGradient(x+4,gy-40,3,x+4,gy-40,30);
gg.addColorStop(0,'rgba(110,255,230,'+(0.35*pul).toFixed(2)+')');gg.addColorStop(1,'rgba(110,255,230,0)');
ctx.fillStyle=gg;ctx.beginPath();ctx.arc(x+4,gy-40,30,0,7);ctx.fill();
ctx.strokeStyle='rgba(160,255,240,.9)';ctx.lineWidth=2;
ctx.beginPath();ctx.arc(x+4,gy-38,6,0.5,Math.PI*1.9);ctx.stroke();
ctx.beginPath();ctx.arc(x+4,gy-38,2.5,Math.PI*0.8,Math.PI*2.2);ctx.stroke();
const ty=(frame%50)/50;
ctx.fillStyle='rgba(200,255,244,'+(1-ty).toFixed(2)+')';
ctx.fillRect(x-2,gy-14-ty*46,12,3);
}else{
ctx.strokeStyle='rgba(30,26,18,.5)';ctx.lineWidth=2;
ctx.beginPath();ctx.arc(x+4,gy-38,6,0.5,Math.PI*1.9);ctx.stroke();
}
}
function drawGoal(){
const px=FLAG_X*TILE+14-camX;
if(px<-120||px>VW+120)return;
const gy=15*TILE;
const act=state==='win';
ctx.fillStyle='#565044';ctx.fillRect(px-42,gy-12,100,12);
const g=ctx.createLinearGradient(0,gy-100,0,gy-10);
g.addColorStop(0,'#8A8272');g.addColorStop(1,'#565044');
ctx.fillStyle=g;
ctx.beginPath();
ctx.moveTo(px-44,gy-12);
ctx.quadraticCurveTo(px-48,gy-72,px-20,gy-92);
ctx.quadraticCurveTo(px+2,gy-104,px+24,gy-90);
ctx.quadraticCurveTo(px+46,gy-74,px+44,gy-12);
ctx.closePath();ctx.fill();
ctx.strokeStyle='rgba(30,26,18,.55)';ctx.lineWidth=3;ctx.stroke();
ctx.fillStyle='rgba(74,138,60,.75)';ctx.fillRect(px-26,gy-98,20,6);ctx.fillRect(px+6,gy-96,18,5);
ctx.fillStyle='#3A362C';
ctx.fillRect(px-30,gy-70,20,8);ctx.fillRect(px+10,gy-70,20,8);
ctx.fillRect(px-8,gy-58,16,10);
ctx.fillRect(px-24,gy-38,48,7);
const pg2=act?1:(0.35+0.15*Math.sin(frame/10));
ctx.fillStyle='#0E2420';
ctx.beginPath();ctx.ellipse(px+2,gy-30,20,26,0,0,7);ctx.fill();
const pgc=ctx.createRadialGradient(px+2,gy-30,4,px+2,gy-30,26);
pgc.addColorStop(0,'rgba(110,255,230,'+(0.45+0.4*pg2).toFixed(2)+')');
pgc.addColorStop(1,'rgba(110,255,230,'+(0.08*pg2).toFixed(2)+')');
ctx.fillStyle=pgc;ctx.beginPath();ctx.ellipse(px+2,gy-30,16,22,0,0,7);ctx.fill();
ctx.strokeStyle='rgba(200,255,244,'+(0.4+0.5*pg2).toFixed(2)+')';ctx.lineWidth=2.5;
ctx.beginPath();ctx.arc(px+2,gy-30,9,0.5,Math.PI*1.9);ctx.stroke();
ctx.beginPath();ctx.arc(px+2,gy-30,4,Math.PI*0.8,Math.PI*2.2);ctx.stroke();
[[px-38],[px+42]].forEach(b=>{
ctx.fillStyle='#5E3A1E';ctx.fillRect(b[0]-6,gy-16,12,16);
ctx.fillStyle='rgba(255,160,60,.9)';
ctx.beginPath();ctx.ellipse(b[0],gy-20+Math.sin(frame/9+b[0])*2,6,7,0,0,7);ctx.fill();
ctx.fillStyle='rgba(255,230,140,.9)';
ctx.beginPath();ctx.ellipse(b[0],gy-18,3,4,0,0,7);ctx.fill();
});
}
function drawWorld(){
if(themeName==='cave'){caveBG();caveFlora()}
else if(themeName==='jungle'){jungleBG()}
else if(themeName==='desert'){desertBG()}
else if(themeName==='aztec'){aztecBG()}
else if(themeName==='maya'){mayaBG()}
else{olmecBG()}
if(themeName==='desert')desertCastle();
else if(themeName==='aztec'){const x0=castleCol*TILE-camX;if(x0>-60&&x0<VW+60)aztecTemplo(x0,15*TILE,dayNight().night>0.5)}
else if(themeName==='maya'){const x0=castleCol*TILE-camX;if(x0>-60&&x0<VW+60)mayaPyramid(x0-22,15*TILE,88,120,dayNight().night>0.5)}
else if(themeName!=='olmec')castle();
drawPowerupsRising();
drawTiles();
chasms(Math.max(0,Math.floor(camX/TILE)-1),Math.min(COLS-1,Math.ceil((camX+VW)/TILE)+1));
if(themeName==='desert')desertTufts(Math.max(0,Math.floor(camX/TILE)-1),Math.min(COLS-1,Math.ceil((camX+VW)/TILE)+1));
else if(themeName==='aztec')aztecTufts(Math.max(0,Math.floor(camX/TILE)-1),Math.min(COLS-1,Math.ceil((camX+VW)/TILE)+1));
else if(themeName==='maya')mayaTufts(Math.max(0,Math.floor(camX/TILE)-1),Math.min(COLS-1,Math.ceil((camX+VW)/TILE)+1));
else if(themeName!=='cave')tufts(Math.max(0,Math.floor(camX/TILE)-1),Math.min(COLS-1,Math.ceil((camX+VW)/TILE)+1));
drawEstela();
drawGoal();
drawPowerups();drawEnemies();drawBoss();drawPlayer();drawFireballs();drawFx();
if(themeName==='desert'||themeName==='aztec'||themeName==='maya')dayLightOverlay();
ctx.drawImage(tileCache.vignette,0,0);
drawHUD();
drawTouchUI();
}
function draw(){
if(state==='title'){drawTitle();return}
if(state==='lvlsel'){drawLevelSelect();return}
if(state==='select'){drawSelect();return}
if(state==='gameover'){drawGameOver();return}
drawWorld();
if(state==='win')drawWinOverlay();
if(paused){ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,VW,VH);txt('PAUSA',VW/2,VH/2,48,'#fff','center')}
}

function pressEnter(){
ac();
if(state==='title'){state='select';selColor=charColor}
else if(state==='lvlsel'){startLevel(lvSel)}
else if(state==='select'){charColor=selColor;startMusic(levelSong());state='playing'}
else if(state==='gameover'){initGame();state='title';startMusic('title')}
else if(state==='win'&&winT<80){
if(levelNum<16){gotoLevel(levelNum+1,true);state='playing'}
else{initGame();state='title';startMusic('title')}
}
}
function confirmSelect(){
ac();
keys.Space=false;
charColor=selColor;startMusic(levelSong());state='playing';
}
const HANDLED=new Set(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','KeyA','KeyD','KeyW','KeyS','Enter','KeyX','KeyK','Escape','KeyL']);
window.addEventListener('keydown',e=>{
if(state==='title'&&!songName&&(e.code==='Enter'||e.code==='Space'||e.code==='ArrowLeft'||e.code==='ArrowRight'))startMusic('title');
if(HANDLED.has(e.code))e.preventDefault();
keys[e.code]=true;
if(e.code!=='KeyF'&&e.code!=='Escape')requestFs();
if((e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')&&!e.repeat)jumpBufT=8;
const st=state;
if(state==='title'&&e.code==='KeyL'){state='lvlsel'}
else if(state==='title'&&/^Digit[1-8]$/.test(e.code)){startLevel(Number(e.code.slice(5)))}
else if(state==='lvlsel'){
if(e.code==='ArrowLeft'||e.code==='KeyA')lvSel=lvSel===1?16:lvSel-1;
else if(e.code==='ArrowRight'||e.code==='KeyD')lvSel=lvSel===16?1:lvSel+1;
else if(e.code==='ArrowUp'||e.code==='KeyW')lvSel=lvSel>4?lvSel-4:lvSel+12;
else if(e.code==='ArrowDown'||e.code==='KeyS')lvSel=lvSel<=12?lvSel+4:lvSel-12;
else if(e.code==='Escape'||e.code==='KeyL'||e.code==='KeyQ'){state='title'}
else if(e.code==='Enter'||e.code==='Space')pressEnter();
}
if(e.code==='Enter'&&state!=='lvlsel')pressEnter();
if(st==='select'){
if(e.code==='ArrowLeft'||e.code==='KeyA')selColor='green';
if(e.code==='ArrowRight'||e.code==='KeyD')selColor='blue';
if(e.code==='Space'&&state==='select')confirmSelect();
}
if(e.code==='KeyM'){toggleMusic();if(musicOn&&!songName)startMusic(state==='title'?'title':levelSong())}
if(e.code==='KeyP'&&state==='playing')paused=!paused;
if(e.code==='KeyR'&&state==='playing')resetLevel();
if(e.code==='KeyF')
toggleFullscreen();
});
window.addEventListener('keyup',e=>{keys[e.code]=false});
window.addEventListener('pointerdown',()=>requestFs());
window.addEventListener('touchstart',()=>requestFs(),{passive:true});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false});

const touchUI=('ontouchstart' in window)||(typeof navigator!=='undefined'&&navigator.maxTouchPoints>0);
let joyId=null,joyX0=0,joyDX=0,jumpId=null,fireId=null,crouchId=null;
const JUMP_BTN={x:VW-95,y:VH-95,r:56},FIRE_BTN={x:VW-210,y:VH-70,r:42},JOY_BTN={x:150,y:VH-95,r:62},CROUCH_BTN={x:52,y:VH-30,r:22};
function tPos(t){const r=canvas.getBoundingClientRect();return{x:(t.clientX-r.left)/r.width*VW,y:(t.clientY-r.top)/r.height*VH}}
canvas.addEventListener('touchstart',e=>{e.preventDefault();
if(state==='title'&&!songName)startMusic('title');
for(const t of e.changedTouches){const p=tPos(t);
if(state==='select'){selColor=p.x<VW/2?'green':'blue';confirmSelect();continue}
if(state==='lvlsel'){const bx=lvBoxes();for(let i=0;i<16;i++){const r=bx.rect(i);if(p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h){startLevel(i+1);break}}continue}
if(state!=='playing'){pressEnter();continue}
if(Math.hypot(p.x-CROUCH_BTN.x,p.y-CROUCH_BTN.y)<CROUCH_BTN.r+12){crouchId=t.identifier;keys.ArrowDown=true}
else if(Math.hypot(p.x-FIRE_BTN.x,p.y-FIRE_BTN.y)<FIRE_BTN.r+14){fireId=t.identifier;keys.KeyX=true}
else if(p.x>=VW*0.45&&jumpId===null){jumpId=t.identifier;keys.Space=true;jumpBufT=8}
else if(joyId===null){joyId=t.identifier;joyX0=p.x;joyDX=0;keys.ArrowLeft=false;keys.ArrowRight=false}
}},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();
for(const t of e.changedTouches){
if(t.identifier===joyId){const p=tPos(t);joyDX=Math.max(-60,Math.min(60,p.x-joyX0));keys.ArrowLeft=joyDX<-10;keys.ArrowRight=joyDX>10;keys.ShiftLeft=Math.abs(joyDX)>45}
}},{passive:false});
function onTouchEnd(e){e.preventDefault();
for(const t of e.changedTouches){
if(t.identifier===joyId){joyId=null;joyDX=0;keys.ArrowLeft=false;keys.ArrowRight=false;keys.ShiftLeft=false}
if(t.identifier===jumpId){jumpId=null;keys.Space=false}
if(t.identifier===fireId){fireId=null;keys.KeyX=false}
if(t.identifier===crouchId){crouchId=null;keys.ArrowDown=false}}}
canvas.addEventListener('touchend',onTouchEnd,{passive:false});
canvas.addEventListener('touchcancel',onTouchEnd,{passive:false});
function drawTouchUI(){
if(!touchUI||state==='gameover')return;
ctx.globalAlpha=0.32;
ctx.strokeStyle='#FFF';ctx.lineWidth=3;
ctx.beginPath();ctx.arc(JOY_BTN.x,JOY_BTN.y,JOY_BTN.r,0,7);ctx.stroke();
ctx.fillStyle='rgba(255,255,255,.4)';
ctx.beginPath();ctx.arc(JOY_BTN.x+joyDX*0.7,JOY_BTN.y,26,0,7);ctx.fill();
ctx.beginPath();ctx.arc(JUMP_BTN.x,JUMP_BTN.y,JUMP_BTN.r,0,7);ctx.stroke();
ctx.beginPath();ctx.arc(FIRE_BTN.x,FIRE_BTN.y,FIRE_BTN.r,0,7);ctx.stroke();
ctx.beginPath();ctx.arc(CROUCH_BTN.x,CROUCH_BTN.y,CROUCH_BTN.r,0,7);ctx.stroke();
ctx.globalAlpha=1;
txt('SALTAR',JUMP_BTN.x,JUMP_BTN.y+6,15,'#FFF','center');
txt('FUEGO',FIRE_BTN.x,FIRE_BTN.y+6,13,keys.KeyX?'#FF9060':'#FFF','center');
ctx.fillStyle=keys.ArrowDown?'#7FE87F':'#FFF';
ctx.beginPath();ctx.moveTo(CROUCH_BTN.x-9,CROUCH_BTN.y-5);ctx.lineTo(CROUCH_BTN.x+9,CROUCH_BTN.y-5);ctx.lineTo(CROUCH_BTN.x,CROUCH_BTN.y+8);ctx.closePath();ctx.fill();
if(joyDX<-10)txt('<<',JOY_BTN.x-30,JOY_BTN.y+5,16,'#FFF','center');
if(joyDX>10)txt('>>',JOY_BTN.x+30,JOY_BTN.y+5,16,'#FFF','center');
}

let last=performance.now(),acc=0;
const STEP=1000/60;
function loop(now){
acc+=Math.min(100,now-last);last=now;
while(acc>=STEP){update();acc-=STEP}
draw();
requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

window.OX={
get state(){return state},set state(v){state=v},
get player(){return player},get enemies(){return enemies},
get powerups(){return powerups},get fireballs(){return fireballs},
get score(){return score},set score(v){score=v},
get coins(){return coins},set coins(v){coins=v},get lives(){return lives},
get camX(){return camX},
get map(){return map},
get keys(){return keys},
get charColor(){return charColor},set charColor(v){charColor=v},
get selColor(){return selColor},set selColor(v){selColor=v},
get themeName(){return themeName},
get boss(){return boss},
gotoLevel,
get tileKeys(){return Object.keys(tileCache)},
get levelSong(){return levelSong()},
initGame,resetLevel,buildLevel,update,draw,
get FLAG_X(){return FLAG_X},
get levelNum(){return levelNum},
TILE,COLS,ROWS
};
</script>
</body>
